[package]
name = "c-ookie-click"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
thiserror = "2"

bytestring = "1.4"
dotenvy = "0.15.7"
itertools = "0.14.0"
jiff = "0.2"
rand = "0.10.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
#sonic-rs = "0.3"
simd-json = "0.17"

futures = "0.3"
tokio = { version = "1", features = ["full"] }

idna_adapter = { version = "=1.0.0", optional = true } # locked to 1.0.0 to prevent pulling in a ton of unicode bullshit
axum = { version = "0.8.9", features = ["http2", "macros", "ws"] }
#tokio-rusqlite = { version = "0.7", features = ["bundled"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs", "trace"] }

sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "sqlite", "derive"] }
bytes = "1.11.1"
